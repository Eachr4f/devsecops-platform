name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
  SYFT_VERSION: "1.52.0"
  SYFT_SHA256: "caeedb81fb0491615f1ebd1761e4145d41ee86dd2cc7bf80669f9f5ad9d6133d"
  COSIGN_VERSION: "3.1.3"
  COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
jobs:
  publish:
    name: Publier ${{ matrix.service }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend]

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      SERVICE: ${{ matrix.service }}
      TRIVY_NO_PROGRESS: "true"
      TRIVY_DISABLE_TELEMETRY: "true"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer Trivy (checksum vérifié)
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tgz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${RUNNER_TEMP}/trivy.tgz" \
            -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"

      - name: Définir le nom de l'image
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/devsecops-${SERVICE}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"

      - name: Construire l'image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            "services/${SERVICE}"

      - name: Scanner l'image avant publication
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${IMAGE}:${GITHUB_SHA}"

      - name: Se connecter à GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GH_TOKEN}" |
            docker login "${REGISTRY}" \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Publier l'image et relever son digest
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          REF="$(docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            "${IMAGE}:${GITHUB_SHA}")"
          case "${REF}" in
            "${IMAGE}@sha256:"*) ;;
            *)
              echo "ERREUR : référence publiée inattendue : ${REF}"
              exit 1
              ;;
          esac
          echo "REF=${REF}" >> "${GITHUB_ENV}"
          printf '%s\n' "${REF}" > "digest-${SERVICE}.txt"

      - name: Installer Syft et Cosign (checksums vérifiés)
        run: |
          mkdir -p "${RUNNER_TEMP}/supply-chain-bin"

          curl -sSfL -o "${RUNNER_TEMP}/syft.tgz" \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  ${RUNNER_TEMP}/syft.tgz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/syft.tgz" \
            -C "${RUNNER_TEMP}/supply-chain-bin" syft

          curl -sSfL -o "${RUNNER_TEMP}/cosign" \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  ${RUNNER_TEMP}/cosign" | sha256sum --check
          install -m 0755 "${RUNNER_TEMP}/cosign" \
            "${RUNNER_TEMP}/supply-chain-bin/cosign"

          echo "${RUNNER_TEMP}/supply-chain-bin" >> "${GITHUB_PATH}"

      - name: Vérifier les versions des outils
        run: |
          syft version
          cosign version

      - name: Générer le SBOM de l'image publiée
        run: |
          syft "registry:${REF}" \
            --output "spdx-json=sbom-${SERVICE}.spdx.json"

      - name: Signer l'image par digest
        run: cosign sign --yes "${REF}"

      - name: Attester le SBOM
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate "sbom-${SERVICE}.spdx.json" \
            "${REF}"

      - name: Vérifier la signature et l'attestation
        run: |
          IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/heads/main"
          ISSUER="https://token.actions.githubusercontent.com"

          cosign verify \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${REF}" > "verification-image-${SERVICE}.json"

          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer "${ISSUER}" \
            "${REF}" > "verification-sbom-${SERVICE}.json"

      - name: Conserver le SBOM et les preuves
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supply-chain-${{ matrix.service }}
          path: |
            digest-${{ matrix.service }}.txt
            sbom-${{ matrix.service }}.spdx.json
            verification-image-${{ matrix.service }}.json
            verification-sbom-${{ matrix.service }}.json
          if-no-files-found: error

      - name: Résumé de la publication
        run: |
          {
            echo "### Image ${SERVICE}"
            echo
            echo "Commit : ${GITHUB_SHA}"
            echo
            echo "Référence par digest :"
            echo '```text'
            echo "${REF}"
            echo '```'
            echo
            echo "SBOM SPDX généré."
            echo "Signature de l'image et attestation du SBOM vérifiées."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Fermer la connexion au registre
        if: always()
        run: docker logout "${REGISTRY}"

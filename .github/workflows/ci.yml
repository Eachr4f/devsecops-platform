name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  SEMGREP_VERSION: "1.180.0"
  TRIVY_VERSION: "0.74.0"
  TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
jobs:
  secrets-scan:
    name: Gitleaks (secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le code (historique complet)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Gitleaks (checksum vérifié)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check
          tar -xzf gitleaks.tgz gitleaks

      - name: Scanner l'historique Git
        run: ./gitleaks git --no-banner --redact --verbose --log-opts="HEAD" --report-format sarif --report-path gitleaks.sarif .

      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore
  lint-test:
    name: Lint et tests (Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/api/requirements-dev.txt

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format (ruff)
        run: ruff format --check .

      - name: Tests et couverture (minimum 70 %)
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Conserver le rapport de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-report
          path: services/api/coverage.xml
          if-no-files-found: ignore
  sast:
    name: Semgrep (SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Analyser le code (bloque si sévérité ERROR)
        run: |
          semgrep scan \
            --config p/default --config p/python --config p/flask --config p/dockerfile \
            --metrics=off \
            --sarif --output semgrep.sarif \
            --error --severity ERROR \
            .

      - name: Envoyer le rapport à GitHub (Security > Code scanning)
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: semgrep.sarif
          category: semgrep
  docker:
    name: Docker (lint, build, smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FRONTEND_BIND_IP: "127.0.0.1"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfile API)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: services/api/Dockerfile
          failure-threshold: warning

      - name: Hadolint (Dockerfile frontend)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: services/frontend/Dockerfile
          failure-threshold: warning

      - name: Construire et démarrer la stack
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Test de fumée fonctionnel
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/api/items
          curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/items \
            -H 'Content-Type: application/json' -d '{"name":"ci-test"}'

      - name: Tests de durcissement
        run: |
          for service in api frontend; do
            test "$(docker compose exec -T "$service" id -u)" != "0" || {
              echo "ERREUR : $service fonctionne en root"
              exit 1
            }

            container_id="$(docker compose ps -q "$service")"
            test -n "$container_id"

            test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$container_id")" = "true" || {
              echo "ERREUR : $service n'est pas en lecture seule"
              exit 1
            }
          done

          curl --fail --silent --show-error --head http://127.0.0.1:8080/ \
            | grep -i "content-security-policy:"

      - name: Logs en cas d'échec
        if: failure()
        run: docker compose logs --no-color

      - name: Nettoyage
        if: always()
        run: docker compose down --volumes
  trivy:
    name: Trivy (dépendances, Dockerfiles, images)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_NO_PROGRESS: "true"
      TRIVY_DISABLE_TELEMETRY: "true"

    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Installer Trivy (checksum vérifié)
        run: |
          curl -sSfL -o "${RUNNER_TEMP}/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  ${RUNNER_TEMP}/trivy.tgz" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/trivy-bin"
          tar -xzf "${RUNNER_TEMP}/trivy.tgz" \
            -C "${RUNNER_TEMP}/trivy-bin" trivy
          echo "${RUNNER_TEMP}/trivy-bin" >> "${GITHUB_PATH}"

      - name: Scanner les dépendances et les Dockerfiles
        run: |
          trivy fs \
            --scanners vuln,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --skip-dirs services/api/.venv \
            .

      - name: Construire les deux images
        run: |
          docker build --pull -t devsecops-api:ci services/api
          docker build --pull -t devsecops-frontend:ci services/frontend

      - name: Produire les rapports SARIF des images
        run: |
          for service in api frontend; do
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 0 \
              --format sarif \
              --output "trivy-${service}.sarif" \
              "devsecops-${service}:ci"
          done

      - name: Bloquer les vulnérabilités graves avec correctif
        run: |
          status=0
          for service in api frontend; do
            echo "Analyse de l'image ${service}"
            trivy image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "devsecops-${service}:ci" || status=1
          done
          exit "${status}"

      - name: Envoyer le rapport API à GitHub
        if: always() && hashFiles('trivy-api.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Envoyer le rapport frontend à GitHub
        if: always() && hashFiles('trivy-frontend.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Conserver les rapports Trivy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: trivy-reports
          path: |
            trivy-api.sarif
            trivy-frontend.sarif
          if-no-files-found: ignore


  ci-ok:
    name: CI OK
    runs-on: ubuntu-24.04
    needs: [secrets-scan, lint-test, sast, docker, trivy]
    if: always()

    steps:
      - name: Vérifier que tous les jobs ont réussi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : ${RESULTS}"
          for r in ${RESULTS}; do
            if [ "$r" != "success" ]; then
              echo "Au moins un job a échoué ou a été ignoré"
              exit 1
            fi
          done
